<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.25), transparent 25%),
                  radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 20%),
                  linear-gradient(135deg, #0f172a 0%, #2563eb 45%, #7c3aed 100%);
      color: #eff6ff;
    }
    .container {
      width: min(100%, 460px);
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 30px 90px rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(24px);
    }
    h1 {
      margin: 0 0 20px;
      text-align: center;
      letter-spacing: 1.6px;
      font-size: clamp(2rem, 3.8vw, 3rem);
      color: #f8fafc;
      text-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }
    .controls,
    .info {
      display: grid;
      gap: 14px;
    }
    .controls button,
    .mode-selector button,
    .symbol-selector button,
    .restart-button {
      padding: 14px 18px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .controls button:hover,
    .mode-selector button:hover,
    .symbol-selector button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(56, 189, 248, 0.2);
    }
    .mode-selector,
    .symbol-selector {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .mode-selector button.active,
    .symbol-selector button.active,
    .difficulty-selector button.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.25);
    }
    .mode-selector button,
    .symbol-selector button,
    .difficulty-selector button {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      min-width: 110px;
    }
    .status {
      text-align: center;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.95);
      font-weight: 700;
      color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.3);
      animation: pulseStatus 3s ease-in-out infinite;
    }
    .controls {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }
    .mode-label {
      text-align: center;
      color: #bfdbfe;
      font-size: 0.95rem;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .difficulty-selector {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-weight: 700;
      border: 1px solid rgba(59, 130, 246, 0.16);
    }
    .scoreboard span {
      flex: 1 1 auto;
      text-align: center;
      min-width: 96px;
    }
    .winning-cell {
      background: rgba(253, 230, 138, 0.95) !important;
      color: #0f172a !important;
      box-shadow: inset 0 0 0 3px rgba(251, 191, 36, 0.9);
    }
    .difficulty-selector button {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 20px auto;
      max-width: 400px;
      padding: 24px;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 24px 80px rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(24px);
    }
    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #0f172a;
      font-size: clamp(2rem, 4vw, 3.8rem);
      display: grid;
      place-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .cell.x {
      color: #ec4899;
      text-shadow: 0 0 18px rgba(236, 72, 153, 0.65);
    }
    .cell.o {
      color: #facc15;
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.65);
    }
    .cell.placed {
      animation: popIn 220ms cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .cell:hover {
      background: rgba(56, 189, 248, 0.18);
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .cell.disabled {
      cursor: default;
      opacity: 0.8;
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0.2; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    .restart-button {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.25);
    }
    @keyframes winningGlow {
      from {
        box-shadow: inset 0 0 0 2px rgba(251, 191, 36, 0.9), 0 0 0 0 rgba(251, 191, 36, 0.2);
      }
      to {
        box-shadow: inset 0 0 0 6px rgba(251, 191, 36, 1), 0 0 24px rgba(251, 191, 36, 0.4);
      }
    }
    @keyframes pulseStatus {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.18); }
      50% { box-shadow: 0 0 28px rgba(56, 189, 248, 0.18); }
    }
    .winning-cell {
      animation: winningGlow 1.8s ease-in-out infinite alternate;
    }
    
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <div class="info">
      <div class="mode-selector" aria-label="Mode selector">
        <button id="pvpButton" class="active">Player vs Player</button>
        <button id="pvcButton">Player vs AI</button>
      </div>
      <div class="symbol-selector" aria-label="Symbol selector">
        <button id="symbolX" class="active">Play as X</button>
        <button id="symbolO">Play as O</button>
      </div>
      <div class="controls">
        <div id="modeLabel" class="mode-label">Mode: Player vs Player</div>
        <div class="difficulty-selector" aria-label="Difficulty selector">
          <button id="easyButton">Easy AI</button>
          <button id="hardButton" class="active">Hard AI</button>
        </div>
        <div class="scoreboard">
          <span id="scoreX">X: 0</span>
          <span id="scoreO">O: 0</span>
          <span id="scoreDraw">Draws: 0</span>
        </div>
      </div>
      <div id="status" class="status">Choose a mode to begin.</div>
    </div>
    <div class="board" id="board"></div>
    <button id="restartButton" class="restart-button">Restart Game</button>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const pvpButton = document.getElementById('pvpButton');
    const pvcButton = document.getElementById('pvcButton');
    const symbolXButton = document.getElementById('symbolX');
    const symbolOButton = document.getElementById('symbolO');
    const easyButton = document.getElementById('easyButton');
    const hardButton = document.getElementById('hardButton');
    const modeLabel = document.getElementById('modeLabel');
    const scoreX = document.getElementById('scoreX');
    const scoreO = document.getElementById('scoreO');
    const scoreDraw = document.getElementById('scoreDraw');
    const restartButton = document.getElementById('restartButton');

    let board = [];
    let currentPlayer = 'x';
    let gameMode = 'pvp';
    let humanSymbol = 'x';
    let aiSymbol = 'o';
    let aiDifficulty = 'hard';
    let gameOver = false;
    let winningLine = [];
    let scores = { x: 0, o: 0, draws: 0 };
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(type, frequency, duration, volume = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.value = volume;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function playClickSound() {
      playTone('sine', 520, 0.07, 0.08);
      setTimeout(() => playTone('sine', 650, 0.05, 0.06), 70);
    }

    function playWinSound() {
      playTone('triangle', 520, 0.15, 0.16);
      setTimeout(() => playTone('triangle', 720, 0.12, 0.12), 140);
    }

    function playDrawSound() {
      playTone('sine', 330, 0.12, 0.08);
      setTimeout(() => playTone('sine', 280, 0.12, 0.08), 120);
    }

    function initBoard() {
      board = [['_', '_', '_'], ['_', '_', '_'], ['_', '_', '_']];
      winningLine = [];
      currentPlayer = 'x';
      gameOver = false;
      renderBoard();
      updateStatus('Game ready. ' + (gameMode === 'pvp' ? "Player X's turn." : `Player ${humanSymbol.toUpperCase()}'s turn.`));
      updateModeLabel();
      updateScoreboard();
      if (gameMode === 'pvc' && currentPlayer === aiSymbol) {
        setTimeout(aiPlay, 300);
      }
    }

    function renderBoard() {
      boardElement.innerHTML = '';
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          if (winningLine.some(pos => pos[0] === row && pos[1] === col)) {
            cell.classList.add('winning-cell');
          }
          cell.textContent = board[row][col] === '_' ? '' : board[row][col].toUpperCase();
          if (board[row][col] !== '_') {
            cell.classList.add(board[row][col]);
            cell.classList.add('placed');
          }
          if (board[row][col] !== '_' || gameOver) {
            cell.classList.add('disabled');
            cell.disabled = true;
          }
          cell.addEventListener('click', (event) => handleCellClick(row, col, event));
          boardElement.appendChild(cell);
        }
      }
    }

    function updateStatus(message) {
      statusElement.textContent = message;
    }

    function handleCellClick(row, col, event) {
      if (gameOver || board[row][col] !== '_') return;
      if (gameMode === 'pvc' && currentPlayer !== humanSymbol) return;
      playClickSound();
      if (event?.currentTarget) {
        event.currentTarget.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(0.95)' },
          { transform: 'scale(1)' }
        ], { duration: 140, easing: 'ease-out' });
      }

      board[row][col] = currentPlayer;
      renderBoard();
      checkGameState();
      if (!gameOver) {
        currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
        if (gameMode === 'pvc' && currentPlayer === aiSymbol) {
          updateStatus('AI is thinking...');
          setTimeout(aiPlay, 300);
        } else {
          updateStatus(`Player ${currentPlayer.toUpperCase()}'s turn.`);
        }
      }
    }

    function checkGameState() {
      const result = checkWinner();
      if (result.winner) {
        gameOver = true;
        winningLine = result.line;
        scores[result.winner] += 1;
        updateScoreboard();
        renderBoard();
        updateStatus(`${result.winner.toUpperCase()} wins!`);
        playWinSound();
        return;
      }
      if (!movesLeft(board)) {
        gameOver = true;
        scores.draws += 1;
        updateScoreboard();
        updateStatus("It's a draw!");
        playDrawSound();
      }
      if (gameOver) renderBoard();
    }

    function evaluate(board) {
      for (let i = 0; i < 3; i++) {
        if (board[i][0] === board[i][1] && board[i][1] === board[i][2] && board[i][0] !== '_') {
          return board[i][0] === 'x' ? 10 : -10;
        }
      }
      for (let j = 0; j < 3; j++) {
        if (board[0][j] === board[1][j] && board[1][j] === board[2][j] && board[0][j] !== '_') {
          return board[0][j] === 'x' ? 10 : -10;
        }
      }
      if (board[0][0] === board[1][1] && board[1][1] === board[2][2] && board[0][0] !== '_') {
        return board[0][0] === 'x' ? 10 : -10;
      }
      if (board[0][2] === board[1][1] && board[1][1] === board[2][0] && board[0][2] !== '_') {
        return board[0][2] === 'x' ? 10 : -10;
      }
      return 0;
    }

    function checkWinner() {
      const lines = [
        [[0, 0], [0, 1], [0, 2]],
        [[1, 0], [1, 1], [1, 2]],
        [[2, 0], [2, 1], [2, 2]],
        [[0, 0], [1, 0], [2, 0]],
        [[0, 1], [1, 1], [2, 1]],
        [[0, 2], [1, 2], [2, 2]],
        [[0, 0], [1, 1], [2, 2]],
        [[0, 2], [1, 1], [2, 0]],
      ];
      for (const line of lines) {
        const [a, b, c] = line;
        if (board[a[0]][a[1]] !== '_' &&
            board[a[0]][a[1]] === board[b[0]][b[1]] &&
            board[a[0]][a[1]] === board[c[0]][c[1]]) {
          return { winner: board[a[0]][a[1]], line };
        }
      }
      return { winner: null, line: [] };
    }

    function movesLeft(board) {
      return board.some(row => row.includes('_'));
    }

    function minimax(boardState, depth, isMaximizing) {
      const score = evaluate(boardState);
      if (score === 10) return score - depth;
      if (score === -10) return score + depth;
      if (!movesLeft(boardState)) return 0;

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            if (boardState[i][j] === '_') {
              boardState[i][j] = 'x';
              best = Math.max(best, minimax(boardState, depth + 1, false));
              boardState[i][j] = '_';
            }
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            if (boardState[i][j] === '_') {
              boardState[i][j] = 'o';
              best = Math.min(best, minimax(boardState, depth + 1, true));
              boardState[i][j] = '_';
            }
          }
        }
        return best;
      }
    }

    function randomMove() {
      const emptyCells = [];
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[i][j] === '_') {
            emptyCells.push({ row: i, col: j });
          }
        }
      }
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function findBestMove() {
      if (aiDifficulty === 'easy') {
        return randomMove();
      }
      let bestVal = aiSymbol === 'x' ? -Infinity : Infinity;
      let bestMove = null;
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[i][j] === '_') {
            board[i][j] = aiSymbol;
            const moveVal = minimax(board, 0, aiSymbol === 'o');
            board[i][j] = '_';
            if ((aiSymbol === 'x' && moveVal > bestVal) || (aiSymbol === 'o' && moveVal < bestVal)) {
              bestVal = moveVal;
              bestMove = { row: i, col: j };
            }
          }
        }
      }
      return bestMove;
    }

    function aiPlay() {
      const bestMove = findBestMove();
      if (!bestMove) return;
      board[bestMove.row][bestMove.col] = aiSymbol;
      renderBoard();
      checkGameState();
      if (!gameOver) {
        currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
        updateStatus(`Player ${humanSymbol.toUpperCase()}'s turn.`);
      }
    }

    function setMode(mode) {
      gameMode = mode;
      pvpButton.classList.toggle('active', mode === 'pvp');
      pvcButton.classList.toggle('active', mode === 'pvc');
      symbolXButton.disabled = mode === 'pvp';
      symbolOButton.disabled = mode === 'pvp';
      easyButton.disabled = mode === 'pvp';
      hardButton.disabled = mode === 'pvp';
      symbolXButton.classList.toggle('active', humanSymbol === 'x');
      symbolOButton.classList.toggle('active', humanSymbol === 'o');
      updateModeLabel();
      initBoard();
    }

    function setHumanSymbol(symbol) {
      humanSymbol = symbol;
      aiSymbol = symbol === 'x' ? 'o' : 'x';
      symbolXButton.classList.toggle('active', symbol === 'x');
      symbolOButton.classList.toggle('active', symbol === 'o');
      initBoard();
    }

    function setDifficulty(level) {
      aiDifficulty = level;
      easyButton.classList.toggle('active', level === 'easy');
      hardButton.classList.toggle('active', level === 'hard');
      initBoard();
    }

    function updateScoreboard() {
      scoreX.textContent = `X: ${scores.x}`;
      scoreO.textContent = `O: ${scores.o}`;
      scoreDraw.textContent = `Draws: ${scores.draws}`;
    }

    function updateModeLabel() {
      modeLabel.textContent = `Mode: ${gameMode === 'pvp' ? 'Player vs Player' : `Player vs AI (${aiDifficulty})`}`;
    }

    pvpButton.addEventListener('click', () => setMode('pvp'));
    pvcButton.addEventListener('click', () => setMode('pvc'));
    symbolXButton.addEventListener('click', () => setHumanSymbol('x'));
    symbolOButton.addEventListener('click', () => setHumanSymbol('o'));
    easyButton.addEventListener('click', () => setDifficulty('easy'));
    hardButton.addEventListener('click', () => setDifficulty('hard'));
    restartButton.addEventListener('click', initBoard);

    initBoard();
  </script>
</body>
</html>
